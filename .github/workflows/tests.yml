# Les tests headless à chaque push et à chaque pull request.
#
# Pourquoi : un push sur `main` PUBLIE le jeu (GitHub Pages sert `main`).
# Ce workflow ne bloque pas la publication — Pages ne l'attend pas —, il la
# DIT : une croix rouge à côté du commit, et le badge du README qui change.
# Zéro dépendance (package.json n'en déclare aucune) : pas de `npm install`.
# `prive/` n'existe pas ici, et les tests qui le lisent le disent
# (« NON ÉPROUVÉ ») au lieu d'échouer.
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tous les tests headless
        run: node tools/run_tests.js
