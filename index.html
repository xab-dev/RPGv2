<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RPG V2</title>
  <style>
    /* --- Jetons de style des menus (specs/08_menus-cartes.md §4.5) --------
       LE seul bloc où une couleur, un rayon ou une épaisseur de menu est
       écrit. Tout y est *provisoire* : Xav répond « plus », « moins » ou
       « bon » en jeu (`V-27`), et la réponse se règle ici, en une ligne.
       Les longueurs sont des NOMBRES D'UNITÉS `--u` (1 u = hauteur de la
       boîte du menu ÷ 270, posée par `ui/grille_cartes.js`) : le menu se
       dessine comme s'il vivait en 480 × 270, téléphone ou grand écran.

       Trois de ces jetons sont relus AU DÉMARRAGE par `main.js`
       (`--menu-carte`, `--menu-accent`, `--menu-danger`) pour le contrôle de
       contraste des `couleur_ui` — ils restent donc en `#rrggbb`, le seul
       format que ce contrôle sait comparer. */
    :root {
      /* Noir bleuté, opaque à 92 % : le jeu se devine derrière, on reste
         « dans » la partie — mais il ne dispute jamais la lecture aux cartes. */
      --menu-fond: rgba(13, 16, 23, 0.92);
      /* Un ton au-dessus du fond. C'est CONTRE lui que se juge chaque accent
         (contraste ≥ 3:1, vérifié au démarrage). */
      --menu-carte: #161b24;
      /* Blanc à 10 % : sépare la carte du fond sans dessiner un cadre. Pas
         d'ombre — sobre, et une ombre coûte cher sur un écran de 280 px. */
      --menu-carte-bordure: rgba(255, 255, 255, 0.10);
      /* `D-100` : le relief d'une carte. Deux opacités de BLANC, jamais deux
         couleurs — un voile clair posé sur le haut de la surface tient
         par-dessus n'importe quel fond (la carte au repos, la carte
         éclaircie du focus, la carte assombrie de l'appui), donc le relief
         ne se dédouble pas par état. C'est la même idée que les facettes en
         alpha pur des icônes de stats (`D-98`), et la raison est la même :
         une seule écriture pour plusieurs régimes de couleur.
         Le premier jeton est le liseré d'un pixel sur l'arête haute, le
         second la lueur qui descend et s'éteint à mi-hauteur. Toujours pas
         d'ombre portée : la décision de sobriété d'origine tient, et un
         dégradé ne coûte aucun flou. */
      --menu-carte-lisere: rgba(255, 255, 255, 0.09);
      --menu-carte-relief: rgba(255, 255, 255, 0.045);
      /* `D-101` : la flaque d'ombre sous une vignette de tuile, et l'arête
         sombre du coin « équipé ». Des jetons, eux aussi — la règle du 20/09
         vaut pour toute la feuille, et un test la fait respecter dans le bloc
         des écrans maître-détail. */
      --menu-vignette-ombre: rgba(0, 0, 0, 0.34);
      --menu-marque-arete: rgba(0, 0, 0, 0.35);
      --menu-carte-bordure-px: 1px;
      --menu-carte-rayon-u: 8;
      /* Blanc cassé et gris bleuté : deux niveaux de lecture, pas trois. */
      --menu-texte-titre: #f4f1ea;
      --menu-texte-phrase: #9aa3b2;
      /* Focus « léger » (à confirmer en jeu) : jamais la couleur seule — la
         bordure s'épaissit, un halo l'entoure ET la carte s'éclaircit. */
      --menu-focus-bordure-px: 1.5px;
      --menu-focus-halo-u: 3;
      --menu-focus-halo-opacite: 18%;
      --menu-focus-eclaircie: 4%;
      /* Appuyé : l'inverse du focus, sans animation (un retour immédiat vaut
         mieux qu'une transition qu'un téléphone lent ferait traîner). */
      --menu-appuye-assombrie: 4%;
      --menu-desactive-opacite: 0.4;
      /* Accent NEUTRE, celui d'avant le choix du follet : blanc chaud. Dès
         qu'un compagnon est choisi, `ui/grille_cartes.js` le remplace par sa
         `couleur_ui` sur la boîte du menu — ce jeton-ci n'est que le défaut. */
      --menu-accent: #f2e9d8;
      /* Danger : magenta, en bordure et en icône, JAMAIS en aplat, toujours
         doublé d'une icône. Aucun accent n'a le droit de lui ressembler
         (vérifié au démarrage) : il doit rester reconnaissable quel que soit
         le follet. */
      --menu-danger: #d6409f;
    }

    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }

    /* --- Le curseur du jeu (`D-108`) -------------------------------------
       `--curseur-jeu` est posée au démarrage par `src/curseur.js`, qui dessine
       l'orbe depuis `visuels.json` et la range dans une image. Le code ne
       connaît toujours aucune valeur de style : il fabrique une image, il ne
       choisit ni couleur ni forme (elles sont en données).

       La valeur de repli (`auto`, `pointer` plus bas) est ce qui rend le
       sous-système « meilleur effort » VISIBLE ici : si la variable n'est
       jamais posée — navigateur qui refuse, silhouette trop grande, module
       absent — la page retombe exactement sur le curseur d'avant ce ticket. */
    html, body { cursor: var(--curseur-jeu, auto); }

    /* Le calque des particules en orbite et de la traînée. Il ne reçoit JAMAIS
       un événement de pointeur (sinon il volerait tous les clics des menus), et
       il passe au-dessus des écrans d'UI : l'orbe, lui, est composé par le
       navigateur par-dessus toute la page, et ses étincelles ne doivent pas
       rester derrière un menu. */
    .curseur-calque {
      position: fixed; left: 0; top: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 10;
      /* `background: transparent` n'est PAS une redondance : la règle `canvas`
         ci-dessus peint tous les canvas en noir (c'est le fond du jeu), et ce
         calque en est un. Sans cette ligne il recouvre l'écran d'un aplat noir
         — vérifié, et seule une capture pouvait le voir : aucun test headless
         ne compose une feuille de style. */
      background: transparent;
    }
    /* `touch-action: none` ne vise QUE le jeu : il empêche le navigateur de
       faire défiler/zoomer la page pendant qu'un doigt pilote le joystick.
       Posé sur `html, body` (ce qu'il était jusqu'à `D-42`), il annonce la
       même chose pour toute la page — et un menu qui déborde n'a alors plus
       aucun moyen d'être parcouru au doigt. Il descend donc sur sa seule
       cible réelle, le canvas. */
    canvas { display: block; background: #000; image-rendering: pixelated; touch-action: none; }

    /* --- Écrans d'UI plein écran (`D-42`) --------------------------------
       Menu Pause, confirmation de reset, Poche, Craft, Coffre, Stats,
       Construction : tous la même classe, posée par `ui/menu.js` (qui ne
       connaît que le nom de la classe, jamais une règle de style). Un seul
       endroit décide donc de ce qu'est un écran d'UI, et le correctif ne
       peut pas être à moitié appliqué.

       Bornés à la hauteur RÉELLEMENT visible : `100dvh` suit la barre
       d'adresse mobile qui se rétracte ; `100vh` reste le repli des
       navigateurs qui ignorent `dvh` (l'ordre des deux déclarations fait le
       repli, jamais un test en JS). */
    .ecran-ui {
      position: fixed; left: 0; top: 0; width: 100%;
      height: 100vh; height: 100dvh;
      background: rgba(0, 0, 0, 0.85); color: #eee; font-family: sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .ecran-ui[hidden] { display: none; }

    /* En-tête figé (`flex: 0 0 auto`) : il ne défile jamais. C'est lui qui
       garantit la règle du ticket — « Fermer » est atteignable sans
       défilement, quelle que soit la longueur de la liste.

       `order: -1` : l'en-tête est le DERNIER enfant dans le DOM et le
       PREMIER à l'écran. Ce n'est pas une coquetterie — « Fermer » reste
       ainsi la dernière entrée du document, donc le dernier cran de
       navigation et le dernier arrêt de la touche Tab, exactement comme
       avant `D-42` : l'ordre du DOM continue de dire l'ordre des entrées, et
       les tests qui vérifient « Fermer toujours en dernier » n'ont pas eu à
       être réécrits pour ce ticket. Seule la place à l'écran change. */
    .ecran-ui-entete { order: -1; flex: 0 0 auto; padding: 0.5rem 0.75rem 0.25rem; }

    /* Corps défilant. `min-height: 0` est ce qui autorise un enfant de flex à
       devenir plus petit que son contenu : sans lui la boîte grandit pour
       tout contenir, déborde de l'écran, et rien ne défile jamais (la valeur
       initiale `auto` d'un item de flex, piège classique). `pan-y` autorise
       le défilement vertical au doigt, et lui seul — le geste horizontal
       reste sans effet, comme dans le jeu. */
    .ecran-ui-corps {
      flex: 1 1 auto; min-height: 0;
      overflow-y: auto; overscroll-behavior: contain;
      touch-action: pan-y; -webkit-overflow-scrolling: touch;
      display: flex; flex-direction: column;
      padding: 0 0.75rem 0.75rem;
    }

    /* --- Menus en grille de cartes (specs/08_menus-cartes.md) --------------
       Posées par `ui/grille_cartes.js`, qui ne connaît que ces noms de
       classes. AUCUNE couleur, aucun rayon, aucune épaisseur n'est écrit
       ici : tout vient du bloc de jetons en tête de cette feuille.

       `.ecran-cartes` s'ajoute à `.ecran-ui` (elle garde donc l'en-tête figé
       et le corps défilant de `D-42`, ce dernier comme simple filet).

       La boîte se cale sur LE RECTANGLE DU CANVAS : le fond couvre toute la
       page, et le rembourrage (`--jeu-x`, `--jeu-y`, posés par le composant)
       ramène le contenu exactement sur le jeu. `--u` = hauteur de ce
       rectangle ÷ 270 : toutes les longueurs ci-dessous sont des multiples de
       `--u`, donc le menu a les mêmes proportions sur un téléphone et sur un
       grand écran — comme s'il était dessiné en 480 × 270.
       Budget vertical (en u) : en-tête 24 · marge 12 · rangée 105 · marge 12
       · rangée 105 · marge 12 = 270. */
    .ecran-cartes {
      --u: 1px; --jeu-x: 0px; --jeu-y: 0px;
      box-sizing: border-box; padding: var(--jeu-y) var(--jeu-x);
      background: var(--menu-fond); color: var(--menu-texte-titre);
      /* Un menu n'est pas un texte : rien ne s'y sélectionne, et l'appui ne
         doit pas flasher en bleu sous le doigt. */
      user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
      /* Chrome Android grossit de lui-même les petits textes (« font
         boosting ») : il casserait la règle « tout en unités --u ». */
      text-size-adjust: 100%; -webkit-text-size-adjust: 100%;
    }

    /* L'en-tête porte LA sortie. Sa hauteur est de 24 u, mais jamais moins de
       40 px DE PAGE (*provisoire*) : à 703 × 280 une unité vaut 1 px, et un
       bouton de 24 px n'est pas une cible pour un pouce. Les deux rangées de
       cartes absorbent la différence (`1fr`). */
    .cartes-entete {
      box-sizing: border-box; padding: 0 calc(12 * var(--u));
      min-height: max(calc(24 * var(--u)), 40px);
      display: flex; align-items: center; gap: calc(8 * var(--u));
    }
    .cartes-titre { margin: 0; flex: 0 0 auto; font-size: calc(12 * var(--u)); font-weight: 700; }
    /* Le message (un refus de plein écran, `D-30`) vit dans l'en-tête : il ne
       déplace aucune carte en apparaissant. */
    .cartes-message, .fiches-sous-titre {
      margin: 0; flex: 1 1 auto; min-width: 0; text-align: right;
      font-size: calc(8 * var(--u)); color: var(--menu-texte-phrase);
    }
    /* Le sous-titre d'un écran « maître-détail » porte une information qu'on
       vient lire (les points de stats à dépenser) : un cran plus gros que le
       message de la grille, qui n'est qu'un avis passager. */
    .fiches-sous-titre { font-size: calc(9.5 * var(--u)); }
    .cartes-bouton-entete {
      --carte-trait: var(--menu-accent);
      flex: 0 0 auto; box-sizing: border-box; cursor: var(--curseur-jeu, pointer);
      min-width: max(calc(24 * var(--u)), 40px); height: max(calc(24 * var(--u)), 40px);
      display: flex; align-items: center; justify-content: center; gap: calc(4 * var(--u));
      background: var(--menu-carte);
      border: var(--menu-carte-bordure-px) solid var(--menu-carte-bordure);
      border-radius: calc(var(--menu-carte-rayon-u) * var(--u));
    }
    .cartes-bouton-entete .carte-icone { width: max(calc(12 * var(--u)), 18px); height: max(calc(12 * var(--u)), 18px); }
    /* « À essayer en jeu : un simple [X] / [←] sans texte » (décision 1 de
       Xav, `V-27`). Pour voir le mot à côté de l'icône : `display: inline`, et
       un `padding` horizontal sur le bouton. Une ligne, ici, et rien d'autre. */
    .cartes-bouton-mot { display: none; font-size: calc(9 * var(--u)); }

    .cartes-corps { padding: calc(12 * var(--u)); }
    /* `minmax(0, 1fr)` et non `1fr` : une piste `1fr` refuse de descendre sous
       la taille de son contenu, et une phrase trop longue élargirait SA
       colonne — les cartes cesseraient d'être égales. */
    .cartes-grille {
      flex: 1 1 auto; min-height: 0;
      display: grid; gap: calc(12 * var(--u));
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
    }
    .cartes-grille[data-colonnes="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    /* `--carte-trait` : la couleur qui « parle » sur cette carte — l'accent, ou
       le danger. Le focus et l'icône la relisent, ils n'ont donc pas à savoir
       si la carte est dangereuse. */
    .carte {
      --carte-trait: var(--menu-accent);
      box-sizing: border-box; min-width: 0; min-height: 0; overflow: hidden; cursor: var(--curseur-jeu, pointer);
      display: flex; align-items: center; gap: calc(10 * var(--u));
      padding: calc(12 * var(--u));
      background: var(--menu-carte);
      border: var(--menu-carte-bordure-px) solid var(--menu-carte-bordure);
      border-radius: calc(var(--menu-carte-rayon-u) * var(--u));
    }
    /* Danger : bordure et icône, JAMAIS un aplat. */
    .carte-danger { --carte-trait: var(--menu-danger); border-color: var(--menu-danger); }

    /* Focus : jamais la couleur seule — le trait s'épaissit, un halo
       l'entoure ET la carte s'éclaircit. L'épaississement passe par une ombre
       portée sans flou plutôt que par `border-width` : une bordure qui
       grossit décalerait le contenu de la carte d'un demi-pixel à chaque
       déplacement du focus.
       Les deux `background` : le second (`color-mix`) l'emporte là où il est
       compris ; ailleurs le premier reste — l'ordre fait le repli, jamais un
       test en JS (même patron que `100vh` / `100dvh`). */
    .carte-focus {
      border-color: var(--carte-trait);
      background: var(--menu-carte);
      background: color-mix(in srgb, var(--menu-carte), white var(--menu-focus-eclaircie));
      box-shadow:
        0 0 0 calc(var(--menu-focus-bordure-px) - var(--menu-carte-bordure-px)) var(--carte-trait),
        0 0 0 calc(var(--menu-focus-halo-u) * var(--u)) color-mix(in srgb, var(--carte-trait) var(--menu-focus-halo-opacite), transparent);
    }
    /* Appuyé : l'inverse du focus, sans animation. */
    .carte:active, .cartes-bouton-entete:active {
      background: color-mix(in srgb, var(--menu-carte), black var(--menu-appuye-assombrie));
    }
    /* Une case vide tient sa place dans la grille et ne dessine RIEN : les
       autres cartes ne glissent pas (la mémoire du pouce prime). */
    .carte-vide { min-width: 0; min-height: 0; }

    /* `D-100` — LE relief, en une règle pour toutes les surfaces de carte.
       Elle vient APRÈS les règles d'état (`.carte-focus`, `:active`) parce
       que celles-ci posent un raccourci `background`, qui remet
       `background-image` à zéro : écrite plus haut, la lueur disparaîtrait
       dès que le focus se pose, et la carte focalisée serait la seule à plat.
       Le dégradé est en blanc translucide, donc il ne connaît pas la couleur
       qu'il éclaire — et il n'a pas à être réécrit par état. */
    .carte, .cartes-bouton-entete, .tuile, .fiche, .fiche-action {
      background-image: linear-gradient(
        180deg,
        var(--menu-carte-lisere) 0,
        var(--menu-carte-lisere) 1px,
        var(--menu-carte-relief) 1px,
        transparent 55%
      );
    }
    /* Une carte vide n'est pas une carte : elle ne prend pas le relief. */
    .carte-vide { background-image: none; }

    /* L'icône est un canvas : la règle `canvas { … }` du jeu, plus haut, s'y
       appliquerait (fond noir, rendu pixelisé, doigt bâillonné) — on la
       défait. Sa COULEUR est lue par `ui/icone_canvas.js` comme teinte. */
    .carte-icone {
      flex: 0 0 auto; width: calc(40 * var(--u)); height: calc(40 * var(--u));
      color: var(--carte-trait);
      background: transparent; image-rendering: auto; touch-action: auto;
    }
    .carte-textes { min-width: 0; display: flex; flex-direction: column; gap: calc(4 * var(--u)); }
    .carte-titre { font-size: calc(13 * var(--u)); font-weight: 700; line-height: 1.15; color: var(--menu-texte-titre); }
    .carte-phrase { font-size: calc(9 * var(--u)); line-height: 1.3; color: var(--menu-texte-phrase); }
    /* L'état d'une bascule EST l'information de la carte : à l'accent. */
    .carte-etat { font-size: calc(10 * var(--u)); color: var(--carte-trait); }
    /* À trois colonnes une carte est trop étroite pour mettre le texte à côté
       de l'icône : on empile. */
    .cartes-grille[data-colonnes="3"] .carte { flex-direction: column; align-items: flex-start; justify-content: center; gap: calc(6 * var(--u)); }
    .cartes-grille[data-colonnes="3"] .carte-icone { width: calc(28 * var(--u)); height: calc(28 * var(--u)); }

    /* --- Écrans « maître-détail » (specs/08_menus-cartes.md, palier C) ------
       Posées par `ui/ecran_fiches.js`. `.ecran-fiches` s'ajoute à
       `.ecran-ui.ecran-cartes` : même boîte calée sur le canvas, même unité
       `--u`, mêmes jetons, MÊME en-tête (`.cartes-entete`) — la sortie est au
       même endroit que sur le menu, au pixel près. Toujours aucune couleur
       écrite ici.

       Budget (en u), dans le corps de 222 u de haut et 456 u de large : une
       grille de tuiles de 264 u (4 colonnes de 60 u, gouttières de 8 u) · une
       marge de 12 u · la fiche, 180 u. Trois rangées de tuiles tiennent sans
       défiler (196 u) même quand l'en-tête prend ses 40 px de page sur un
       petit écran ; au-delà la grille défile À L'INTÉRIEUR D'ELLE-MÊME, et le
       défilement suit le focus. L'en-tête et la fiche, eux, ne bougent pas.

       Les 4 u de rembourrage de la grille sont la place du halo de focus :
       une boîte qui défile rogne ce qui dépasse d'elle. Le corps les rend
       (8 u au lieu de 12 sur trois côtés). */
    .fiches-corps {
      flex-direction: row; overflow: hidden; gap: calc(8 * var(--u));
      padding: calc(8 * var(--u)) calc(12 * var(--u)) calc(8 * var(--u)) calc(8 * var(--u));
    }
    .fiches-tuiles {
      flex: 0 0 auto; box-sizing: content-box; width: calc(264 * var(--u)); min-height: 0;
      padding: calc(4 * var(--u));
      overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
      /* Le défilement suit le focus (`scrollIntoView`) : sans cette marge il
         collerait la tuile au bord, et le halo du focus serait rogné. */
      scroll-padding: calc(4 * var(--u));
      /* Pas de barre : sur un PC elle mangerait la largeur des colonnes et
         ferait glisser les tuiles dès qu'elle apparaît (la mémoire du pouce
         prime). Ce qui dit « il y en a d'autres », c'est la rangée coupée au
         bord ; la molette, le doigt et le focus font défiler. */
      scrollbar-width: none;
      display: grid; align-content: start; gap: calc(8 * var(--u));
      grid-template-columns: repeat(var(--tuiles-colonnes, 4), minmax(0, 1fr));
    }
    .fiches-tuiles::-webkit-scrollbar { display: none; }
    /* Un intertitre occupe toute une ligne de la grille ; sa hauteur est la
       sienne (les rangées sont `auto`, ce sont les tuiles qui ont une hauteur). */
    .fiches-groupe {
      grid-column: 1 / -1; font-size: calc(9 * var(--u)); font-weight: 700;
      color: var(--menu-texte-phrase); padding-top: calc(2 * var(--u));
    }
    .tuile {
      --carte-trait: var(--menu-accent);
      position: relative; box-sizing: border-box; height: calc(60 * var(--u)); min-width: 0;
      overflow: hidden; cursor: var(--curseur-jeu, pointer);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(3 * var(--u));
      padding: calc(4 * var(--u));
      background: var(--menu-carte);
      border: var(--menu-carte-bordure-px) solid var(--menu-carte-bordure);
      border-radius: calc(var(--menu-carte-rayon-u) * var(--u));
    }
    /* Le focus d'une tuile EST celui d'une carte (`.carte-focus`, plus haut :
       trait épaissi, halo, carte éclaircie). Seuls le fond et la bordure sont
       redits ici : `.tuile` vient après `.carte-focus` dans cette feuille, à
       spécificité égale elle les lui reprendrait. */
    .tuile.carte-focus {
      border-color: var(--carte-trait);
      background: var(--menu-carte);
      background: color-mix(in srgb, var(--menu-carte), white var(--menu-focus-eclaircie));
    }
    .tuile:active, .fiche-action:active {
      background: color-mix(in srgb, var(--menu-carte), black var(--menu-appuye-assombrie));
    }
    .tuile-vide { min-width: 0; height: calc(60 * var(--u)); }
    /* `D-101` : la vignette est un peu plus grande (28 u -> 31 u) et POSÉE.
       Le fond est une flaque d'ombre sous l'objet, pas un cadre : les
       silhouettes de `visuels.json` portent déjà leur ombre propre (charte
       d'item du 21/09), mais elle est dessinée DANS le canvas et se perd sur
       le fond uni d'une tuile. Cette flaque-ci lui rend son sol.
       Elle est centrée à 72 % de la hauteur, là où repose le bas d'un objet,
       et non au milieu : une ombre qui entoure l'objet le ferait flotter. */
    .tuile .tuile-icone {
      width: calc(31 * var(--u)); height: calc(31 * var(--u));
      background: radial-gradient(ellipse at 50% 72%, var(--menu-vignette-ombre) 0, transparent 62%);
    }
    /* La vignette de la FICHE, elle, est déjà grande et posée sur un panneau
       large : la même flaque y serait une tache. Elle garde le fond neutre
       de `.carte-icone`. */
    .tuile-nom {
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: calc(8.5 * var(--u)); line-height: 1.2; color: var(--menu-texte-titre);
    }
    .tuile-quantite {
      position: absolute; top: calc(3 * var(--u)); right: calc(5 * var(--u));
      font-size: calc(10 * var(--u)); font-weight: 700; color: var(--menu-texte-titre);
    }
    /* « Équipé » : un coin plein, à l'accent. Une FORME — jamais la couleur
       seule, et pas un caractère (aucun emoji, aucune coche de police). */
    .tuile-marque {
      position: absolute; top: 0; left: 0; width: 0; height: 0;
      border-top: calc(12 * var(--u)) solid var(--carte-trait);
      border-right: calc(12 * var(--u)) solid transparent;
    }
    /* `D-101` : l'arête du coin, un trait sombre le long de l'hypoténuse. Le
       coin plein tombait sinon directement dans le fond de la tuile, et sa
       diagonale se lisait comme une coupure de la carte plutôt que comme une
       pièce posée dessus. Deuxième triangle, décalé d'un pixel — la même
       astuce que « glisser la même forme » de la charte d'item. */
    .tuile-marque::after {
      content: ''; position: absolute; top: calc(-12 * var(--u)); left: 0;
      width: 0; height: 0;
      border-top: calc(12 * var(--u)) solid var(--menu-marque-arete);
      border-right: calc(12 * var(--u)) solid transparent;
      transform: translate(1px, 1px);
      z-index: -1;
    }
    /* Grisée : un indice, pas un verrou (l'action est retentée quand même). */
    .tuile-grisee .tuile-icone, .tuile-grisee .tuile-nom, .tuile-grisee .tuile-quantite { opacity: var(--menu-desactive-opacite); }

    .fiche {
      /* L'icône de la fiche relit `--carte-trait`, comme celle d'une tuile. */
      --carte-trait: var(--menu-accent);
      flex: 1 1 auto; min-width: 0; min-height: 0; box-sizing: border-box; overflow: hidden;
      margin: calc(4 * var(--u)) 0;
      display: flex; flex-direction: column; gap: calc(8 * var(--u));
      padding: calc(12 * var(--u));
      background: var(--menu-carte);
      border: var(--menu-carte-bordure-px) solid var(--menu-carte-bordure);
      border-radius: calc(var(--menu-carte-rayon-u) * var(--u));
    }
    .fiche-tete { flex: 0 0 auto; display: flex; align-items: center; gap: calc(8 * var(--u)); min-width: 0; }
    .fiche .fiche-icone { width: calc(32 * var(--u)); height: calc(32 * var(--u)); }
    .fiche-titre { min-width: 0; font-size: calc(13 * var(--u)); font-weight: 700; line-height: 1.15; color: var(--menu-texte-titre); }
    /* Le détail défile dans la fiche s'il le faut ; le bouton d'action, non. */
    .fiche-lignes {
      flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
      display: flex; flex-direction: column; gap: calc(4 * var(--u));
    }
    .fiche-ligne { margin: 0; font-size: calc(9 * var(--u)); line-height: 1.3; color: var(--menu-texte-phrase); }
    /* `D-103` : une ligne qui montre ce dont elle parle (un ingrédient, un
       coût en monnaie). La vignette est calée sur la HAUTEUR du texte — une
       icône plus grande ferait une liste de tuiles là où on attend une liste
       de phrases ; `align-items: center` la pose sur la ligne de base
       visuelle sans dépendre de la fonte. */
    .fiche-ligne-icone { display: flex; align-items: center; gap: calc(4 * var(--u)); }
    .fiche .fiche-ligne-vignette { flex: 0 0 auto; width: calc(12 * var(--u)); height: calc(12 * var(--u)); }
    /* Le bouton de la fiche : à l'accent, bordure et texte — jamais un aplat
       (même règle que le danger). Cible tactile : 40 px de page au moins. */
    .fiche-action {
      flex: 0 0 auto; box-sizing: border-box; cursor: var(--curseur-jeu, pointer);
      min-height: max(calc(24 * var(--u)), 40px); padding: 0 calc(8 * var(--u));
      display: flex; align-items: center; justify-content: center; text-align: center;
      font-size: calc(11 * var(--u)); font-weight: 700; color: var(--menu-accent);
      background: var(--menu-carte);
      border: var(--menu-focus-bordure-px) solid var(--menu-accent);
      border-radius: calc(var(--menu-carte-rayon-u) * var(--u));
    }
    /* Le glyphe du verbe qui actionne le bouton (manette, clavier) : une
       pastille discrète devant le libellé — un contour, jamais un aplat. */
    .fiche-action { gap: calc(6 * var(--u)); }
    .fiche-action-glyphe {
      flex: 0 0 auto; padding: 0 calc(4 * var(--u)); line-height: 1.5;
      font-size: calc(8.5 * var(--u)); font-weight: 700; color: var(--menu-texte-phrase);
      border: var(--menu-carte-bordure-px) solid var(--menu-carte-bordure);
      border-radius: calc(4 * var(--u));
    }
    /* Désactivé (§4.5) : texte à 40 %, aucune bordure d'accent. */
    .fiche-action-grisee { color: var(--menu-texte-titre); border-color: var(--menu-carte-bordure); }
    .fiche-action-grisee { color: color-mix(in srgb, var(--menu-texte-titre) calc(var(--menu-desactive-opacite) * 100%), transparent); }
    /* `D-08` : la seconde action (X) se lit comme seconde : bordure neutre,
       texte clair — le même bouton, moins appuyé, jamais une autre forme. */
    .fiche-action-secondaire { color: var(--menu-texte-titre); border-color: var(--menu-carte-bordure); }
    .fiche-vide { margin: auto; text-align: center; font-size: calc(10 * var(--u)); line-height: 1.3; color: var(--menu-texte-phrase); }
  </style>
</head>
<body>
  <canvas id="jeu" width="800" height="600"></canvas>
  <script type="module" src="src/main.js"></script>
</body>
</html>
