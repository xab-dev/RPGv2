<!doctype html>
<!-- OUTIL DE DEV, jamais chargé par le jeu : l'INSTRUMENT DE PIXELS des
     silhouettes de data/visuels.json (spec 17, palier A). Se lance d'ordinaire
     par `node tools/mesure_visuel.mjs <commande>`, qui prépare la référence
     Git et lit `window.resultat` ; s'ouvre aussi à la main pour voir les
     écarts.
     ?commande=diff|cles|saut|fuite|cache|cout  &id=visuel_heros,visuel_plume | tous
     &ref=tools/variantes/_ref/<sha>  (diff : l'arbre de référence extrait)
     &echelle=3 (l'échelle de rendu ; le jeu à DPR 3)
     Ce que chaque commande prouve est écrit au-dessus de sa fonction. Rien de
     tout ça ne dit « c'est beau » : le verdict reste à Xav, en jeu. -->
<html lang="fr"><head><meta charset="utf-8"><title>Mesure visuel</title>
<style>
  body { background:#1b1f24; color:#d8d2c4; font:12px monospace; margin:0; padding:14px; }
  figure { display:inline-block; margin:0 10px 10px 0; text-align:center; vertical-align:top; }
  figcaption { opacity:.7; margin-top:3px; }
  h2 { font-size:13px; font-weight:normal; margin:14px 0 6px; }
  pre { white-space:pre-wrap; opacity:.85; }
</style></head><body>
<div id="planches"></div>
<pre id="bilan">…</pre>
<script type="module">
  import * as visuels from '../src/visuels.js';
  import * as orientation from '../src/orientation.js';
  import * as poses from '../src/poses.js';
  import { boitePrimitive } from '../src/structures.js';
  import { cadreVisuels, rendreVisuel, agrandir, ecartRendus, rejouerMarche, figure } from './lib_visuel.js';

  const params = new URLSearchParams(location.search);
  const commande = params.get('commande') || 'cles';
  const echelle = Number(params.get('echelle')) || 3;
  const catalogue = await (await fetch('../data/visuels.json')).json();
  const idsDemandes = params.get('id') || 'visuel_heros';
  const ids = idsDemandes === 'tous' ? catalogue.map((v) => v.id) : idsDemandes.split(',');
  const parId = (liste, id) => liste.find((v) => v.id === id) || null;
  const TEINTE = '#ff6a3d';
  const $planches = document.getElementById('planches');
  const titre = (texte) => $planches.append(Object.assign(document.createElement('h2'), { textContent: texte }));
  // La page n'affiche que ce qui cloche (ou les pics) : 123 visuels × des
  // dizaines de cas rendraient une page que personne ne lit.
  const montrer = (canvases, legende) => {
    const loupe = Math.max(1, Math.min(4, Math.round(160 / canvases[0].height)));
    const bloc = document.createElement('div');
    bloc.append(...canvases.map((c) => agrandir(c, loupe)));
    $planches.append(figure(bloc, legende));
  };

  // Les cas qu'un visuel sait dessiner : sans direction ; et, s'il déclare
  // des `orientations`, chacune des huit, le tour tous les 5°, et une marche
  // rejouée (le souffle, le pas, la capuche en retard).
  function cas(v, mods) {
    const teinte = v.teintable ? TEINTE : null;
    const liste = [{ nom: 'aucune', options: { teinte } }];
    if (!v.orientations) return liste;
    for (const o of orientation.ORIENTATIONS) liste.push({ nom: o, options: { teinte, orientation: o } });
    for (let a = 0; a < 360; a += 5) liste.push({ nom: `${a}°`, options: { teinte, angle: a } });
    const film = rejouerMarche(mods, v);
    if (film) for (const e of film) liste.push({ nom: `marche ${e.tMs} ms`, options: { teinte, angle: e.angle, animation: e.animation }, film: e.tMs });
    return liste;
  }

  // DIFF — le rendu de l'arbre de travail contre celui d'une référence Git
  // (code ET données de la référence). Le filet d'un allègement : 0 pixel
  // d'écart sur tout visuel, à l'échelle du jeu et à la loupe ×9. Une marche
  // se rejoue avec les modules de CHAQUE version : l'état d'affichage d'une
  // référence est le sien.
  async function diff() {
    const ref = params.get('ref');
    if (!ref) throw new Error('diff : &ref= manque (le lancer par tools/mesure_visuel.mjs)');
    const ancien = {
      visuels: await import(`/${ref}/src/visuels.js`),
      orientation: await import(`/${ref}/src/orientation.js`).catch(() => null),
      poses: await import(`/${ref}/src/poses.js`).catch(() => null),
      boite: (await import(`/${ref}/src/structures.js`)).boitePrimitive,
    };
    const catalogueRef = await (await fetch(`/${ref}/data/visuels.json`)).json();
    const res = { visuels: {}, total: 0, neufs: [], retires: [] };
    for (const id of ids) {
      const vn = parId(catalogue, id);
      const va = parId(catalogueRef, id);
      if (!va) { res.neufs.push(id); continue; }
      if (!vn) { res.retires.push(id); continue; }
      const cadre = cadreVisuels([va, vn], boitePrimitive);
      const casNeufs = cas(vn, { orientation, poses });
      const casAnciens = cas(va, { orientation: ancien.orientation, poses: ancien.poses });
      const ecarts = {};
      for (const e of [echelle, 9]) {
        for (const c of casNeufs) {
          const c0 = casAnciens.find((x) => x.nom === c.nom);
          if (!c0) { ecarts[`${c.nom} ×${e}`] = 'absent de la référence'; continue; }
          const a = rendreVisuel(ancien.visuels, va, c0.options, { cadre, echelle: e });
          const b = rendreVisuel(visuels, vn, c.options, { cadre, echelle: e });
          const { pixels, max, image } = ecartRendus(a, b);
          if (pixels > 0) {
            ecarts[`${c.nom} ×${e}`] = { pixels, max };
            res.total += pixels;
            if (Object.keys(ecarts).length <= 6) montrer([a, b, image], `${id} · ${c.nom} ×${e} · ${pixels} px, max ${max}`);
          }
        }
      }
      // Un résumé par visuel : combien de cas touchés, le pire, et les premiers
      // noms. Le détail complet noierait la sortie (le tour seul fait 144 cas).
      const touches = Object.entries(ecarts);
      if (!touches.length) { res.visuels[id] = 0; continue; }
      const chiffres = touches.filter(([, e]) => typeof e === 'object');
      const pire = chiffres.sort(([, x], [, y]) => y.pixels - x.pixels)[0];
      res.visuels[id] = {
        cas: touches.length, pixels: chiffres.reduce((s, [, e]) => s + e.pixels, 0),
        pire: pire ? `${pire[0]} : ${pire[1].pixels} px, max ${pire[1].max}` : null,
        exemples: touches.slice(0, 8).map(([nom]) => nom),
      };
    }
    res.touches = Object.entries(res.visuels).filter(([, e]) => e !== 0).map(([id]) => id);
    return res;
  }

  // CLÉS — aux angles clés (0°, 45°…), le rendu à tout angle (spec 16) est la
  // pose déclarée de la direction, au pixel près (critère du palier A de la
  // spec 16) : le mélange ne doit rien retoucher des huit vues validées.
  function cles() {
    const res = {};
    for (const id of ids) {
      const v = parId(catalogue, id);
      if (!v?.orientations) continue;
      const cadre = cadreVisuels([v], boitePrimitive);
      const teinte = v.teintable ? TEINTE : null;
      res[id] = {};
      orientation.ORIENTATIONS.forEach((o, i) => {
        const a = rendreVisuel(visuels, v, { teinte, orientation: o }, { cadre, echelle });
        const b = rendreVisuel(visuels, v, { teinte, angle: i * 45 }, { cadre, echelle });
        const { pixels, max, image } = ecartRendus(a, b);
        res[id][o] = pixels === 0 ? 0 : { pixels, max };
        if (pixels) montrer([a, b, image], `${id} · ${o} contre ${i * 45}° · ${pixels} px`);
      });
    }
    return res;
  }

  // SAUT — le tour au degré près : l'écart entre deux angles voisins, en
  // pixels qui changent de plus de 10. Un dessin qui « claque » à un angle
  // y fait un pic ; le tour sain est une ligne basse et régulière. Rend les
  // cinq pics, la médiane et la moyenne (un pic se juge contre elles).
  function saut() {
    const res = {};
    for (const id of ids) {
      const v = parId(catalogue, id);
      if (!v?.orientations) continue;
      const cadre = cadreVisuels([v], boitePrimitive);
      const teinte = v.teintable ? TEINTE : null;
      const rendus = [];
      for (let a = 0; a < 360; a += 1) rendus.push(rendreVisuel(visuels, v, { teinte, angle: a }, { cadre, echelle }));
      const ecarts = rendus.map((r, a) => ({ de: a, vers: (a + 1) % 360, pixels: ecartRendus(r, rendus[(a + 1) % 360], 10).pixels }));
      const tries = [...ecarts].sort((x, y) => y.pixels - x.pixels);
      const valeurs = ecarts.map((e) => e.pixels).sort((x, y) => x - y);
      res[id] = {
        pics: tries.slice(0, 5).map((e) => `${e.de}→${e.vers} : ${e.pixels}`),
        mediane: valeurs[180], moyenne: Math.round(valeurs.reduce((s, x) => s + x, 0) / 360),
      };
      titre(`${id} · les pics du tour`);
      for (const e of tries.slice(0, 5)) montrer([rendus[e.de], rendus[e.vers], ecartRendus(rendus[e.de], rendus[e.vers], 10).image], `${e.de}° → ${e.vers}° · ${e.pixels} px`);
    }
    return res;
  }

  // FUITE — `dessinerVisuel` rend le contexte comme il l'a trouvé : même
  // transform, même alpha, mêmes styles, et aucune découpe (`clip`) restée
  // active. Une fuite ne se voit pas sur la silhouette : elle décale ou
  // efface tout ce qui se dessine APRÈS elle dans la frame.
  function fuite() {
    const res = {};
    const c = document.createElement('canvas');
    c.width = 200; c.height = 200;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    const etat = () => {
      const t = ctx.getTransform();
      return JSON.stringify([t.a, t.b, t.c, t.d, t.e, t.f, ctx.globalAlpha, ctx.fillStyle, ctx.strokeStyle, ctx.lineWidth, ctx.globalCompositeOperation]);
    };
    for (const id of ids) {
      const v = parId(catalogue, id);
      if (!v) continue;
      const fautes = [];
      for (const { nom, options } of cas(v, { orientation, poses })) {
        ctx.reset();
        ctx.setTransform(3, 0, 0, 3, 100, 100);
        ctx.globalAlpha = 0.7; ctx.fillStyle = '#123456'; ctx.strokeStyle = '#654321'; ctx.lineWidth = 2;
        const avant = etat();
        visuels.dessinerVisuel(ctx, v, 0, 0, options);
        if (etat() !== avant) fautes.push(`${nom} : état ${etat()} ≠ ${avant}`);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 200, 200);
        const d = ctx.getImageData(0, 0, 200, 200).data;
        let blancs = 0;
        for (let i = 0; i < d.length; i += 4) if (d[i] === 255 && d[i + 1] === 255 && d[i + 2] === 255) blancs += 1;
        if (blancs !== 200 * 200) fautes.push(`${nom} : une découpe reste active (${200 * 200 - blancs} px hors d'atteinte)`);
      }
      res[id] = fautes.length ? fautes : 0;
    }
    return res;
  }

  // CACHE — les dégradés gardés (`D-271`) : un contexte qui a déjà dessiné la
  // silhouette ailleurs (autre transform, autre teinte) la redessine comme un
  // contexte neuf. Un dégradé gardé avec ses coordonnées du premier dessin
  // décalerait la lumière.
  function cache() {
    const res = {};
    for (const id of ids) {
      const v = parId(catalogue, id);
      if (!v || !v.primitives.some((p) => p.degrade)) continue;
      const cadre = cadreVisuels([v], boitePrimitive);
      const fautes = [];
      for (const { nom, options } of cas(v, { orientation, poses })) {
        const frais = rendreVisuel(visuels, v, options, { cadre, echelle });
        const partage = document.createElement('canvas');
        partage.width = frais.width; partage.height = frais.height;
        const ctx = partage.getContext('2d', { willReadFrequently: true });
        ctx.setTransform(echelle * 2, 0, 0, echelle * 2, 7, 11);
        visuels.dessinerVisuel(ctx, v, 0, 0, { ...options, teinte: v.teintable ? '#4fb3ff' : null });
        visuels.dessinerVisuel(ctx, v, 0, 0, options);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = '#2b3138';
        ctx.fillRect(0, 0, partage.width, partage.height);
        ctx.setTransform(echelle, 0, 0, echelle, partage.width / 2, -cadre.haut * echelle);
        visuels.dessinerVisuel(ctx, v, 0, 0, options);
        const { pixels, image } = ecartRendus(frais, partage);
        if (pixels) { fautes.push(`${nom} : ${pixels} px`); montrer([frais, partage, image], `${id} · ${nom} · ${pixels} px`); }
      }
      res[id] = fautes.length ? fautes : 0;
    }
    return res;
  }

  // COÛT — le temps d'un `dessinerVisuel`, en microsecondes, sur un vrai
  // canvas à l'échelle du jeu : le héros qui tourne (360 angles) en marchant
  // (l'état d'une marche rejouée), puis immobile par direction. La médiane de
  // cinq passes, après une passe de chauffe (les poses gardées, les dégradés
  // gardés, le JIT). Un ORDRE DE GRANDEUR pour comparer deux versions sur la
  // même machine, jamais un verdict de fluidité (le banc de perf le rend, en
  // jeu : skill `banc-perf`).
  function cout() {
    const res = {};
    const c = document.createElement('canvas');
    c.width = 200; c.height = 200;
    // Un canvas LOGICIEL (`willReadFrequently`) : un canvas accéléré renvoie
    // le travail au GPU et le paie à un vidage imprévisible — la mesure
    // variait du simple au quadruple. Le logiciel mesure le coût CPU, celui
    // qui compte (le coût d'un calque est CPU, skill `banc-perf`).
    const ctx = c.getContext('2d', { willReadFrequently: true });
    const mesurer = (dessins) => {
      const passes = [];
      // L'horloge d'une page sans fenêtre est grossie (100 µs) : une passe
      // compte au moins 400 dessins, sinon un dessin seul se lit 0 ou 100.
      const tours = Math.ceil(400 / dessins.length);
      for (let p = 0; p < 6; p += 1) {
        const t0 = performance.now();
        for (let k = 0; k < tours; k += 1) {
          for (const options of dessins) {
            ctx.setTransform(echelle, 0, 0, echelle, 100, 100);
            visuels.dessinerVisuel(ctx, dessins.visuel, 0, 0, options);
          }
        }
        passes.push(((performance.now() - t0) * 1000) / (dessins.length * tours));
      }
      const tries = passes.slice(1).sort((x, y) => x - y);
      return Math.round(tries[2] * 10) / 10;
    };
    for (const id of ids) {
      const v = parId(catalogue, id);
      if (!v) continue;
      const teinte = v.teintable ? TEINTE : null;
      const statique = Object.assign([{ teinte }], { visuel: v });
      res[id] = { 'sans direction (µs)': mesurer(statique) };
      if (!v.orientations) continue;
      const film = rejouerMarche({ orientation, poses }, v, { dureeMs: 1600, tous: 1 }) || [];
      const tour = Object.assign(Array.from({ length: 360 }, (_, a) => ({ teinte, angle: a, animation: film[a % film.length]?.animation ?? null })), { visuel: v });
      const directions = Object.assign(orientation.ORIENTATIONS.map((o) => ({ teinte, orientation: o })), { visuel: v });
      res[id]['tour immobile (µs)'] = mesurer(Object.assign(tour.map((o) => ({ ...o, animation: null })), { visuel: v }));
      res[id]['tour en marche (µs)'] = mesurer(tour);
      res[id]['huit directions (µs)'] = mesurer(directions);
    }
    return res;
  }

  const COMMANDES = { diff, cles, saut, fuite, cache, cout };
  try {
    if (!COMMANDES[commande]) throw new Error(`commande inconnue : ${commande} (${Object.keys(COMMANDES).join(', ')})`);
    const resultat = await COMMANDES[commande]();
    // `diff` sur tout le catalogue : seuls les visuels touchés se lisent.
    if (resultat.visuels) resultat.visuels = Object.fromEntries(Object.entries(resultat.visuels).filter(([, e]) => e !== 0));
    document.getElementById('bilan').textContent = `${commande} · ${ids.length} visuel(s)\n${JSON.stringify(resultat, null, 1)}`;
    window.resultat = resultat;
  } catch (erreur) {
    document.getElementById('bilan').textContent = String(erreur.stack || erreur);
    window.resultat = { erreur: String(erreur.message || erreur) };
  }
</script></body></html>
